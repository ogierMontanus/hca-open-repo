// Build title→reg reverse index for co-work linking
const TITLE_TO_REG = {};
for (const [reg, w] of Object.entries(WORKS)) TITLE_TO_REG[w.title] = reg;

function wdBadge(q, label) {
  return `<a href="https://www.wikidata.org/wiki/${q}" class="wd-badge" target="_blank" rel="noopener" title="${label||q} på Wikidata">wd:${q}</a>`;
}

// Merge auto-generated works under hand-curated ones.
// WORKS (this file, hand-curated) overrides WORKS_EXTRA (generated from
// entities.csv via scripts/build_mockup/build_works_extra.py) — so any
// ?reg=… link from a category page resolves to real metadata even when
// no hand-curated entry exists.
const ALL_WORKS = Object.assign({}, (typeof WORKS_EXTRA !== 'undefined' ? WORKS_EXTRA : {}), WORKS);

(function () {
  const params = new URLSearchParams(location.search);
  const reg = params.get('reg') || 'Reg000365';
  const w = ALL_WORKS[reg];

  if (!w) {
    document.getElementById('js-title').textContent = 'Ukendt værk — ' + reg;
    return;
  }

  document.title = w.title + ' — H.C. Andersen Dagbogsregister';

  // Breadcrumb
  document.getElementById('js-breadcrumb').innerHTML =
    `<a href="index.html">Forside</a>` +
    `<span class="breadcrumb__sep">›</span>` +
    `<a href="${w.wing}">${w.wingLabel}</a>` +
    `<span class="breadcrumb__sep">›</span>` +
    `<span style="color:var(--color-text-muted)">${w.h3}</span>` +
    `<span class="breadcrumb__sep">›</span>` +
    `<span class="breadcrumb__current">${w.title}</span>`;

  // Hero title + chips
  document.getElementById('js-title').textContent = w.title;
  let chips = `<span class="chip">${w.h2}</span><span class="chip">${w.h3}</span><span class="chip chip--work">${reg}</span>`;
  if (w.wd) chips += wdBadge(w.wd, w.title);
  document.getElementById('js-chips').innerHTML = chips;

  // Hero meta
  const metaItems = [`${w.refs} poster i dagbøgerne`, `${w.wingLabel} · ${w.h3}`];
  if (w.lang) metaItems.push(w.lang);
  document.getElementById('js-meta').innerHTML = metaItems.map(m => `<span>${m}</span>`).join('');

  // ── Sidebar ──────────────────────────────────────────────────────────────
  let sb = '';

  // 1. Registeroplysninger
  sb += `<div class="sidebar-box"><div class="sidebar-box__title">Registeroplysninger</div><dl class="register-dl">`;
  sb += `<dt>ID</dt><dd style="font-family:monospace">${reg}</dd>`;
  sb += `<dt>H1</dt><dd>VÆRK-REGISTER</dd>`;
  sb += `<dt>H2</dt><dd>${w.h2}</dd>`;
  sb += `<dt>H3</dt><dd>${w.h3}</dd>`;
  if (w.author) {
    sb += `<dt>Forfatter</dt><dd><a href="person.html" style="color:var(--color-accent)">${w.author}</a>`;
    if (w.authorWd) sb += ` ${wdBadge(w.authorWd, w.author)}`;
    sb += `</dd>`;
  }
  if (w.lang) sb += `<dt>Originalsprog</dt><dd>${w.lang}</dd>`;
  sb += `<dt>Antal refs.</dt><dd>${w.refs}</dd>`;
  sb += `</dl></div>`;

  // 2. Image
  if (w.image) {
    sb += `<div class="sidebar-box" style="padding:0;overflow:hidden"><img src="${w.image}" alt="${w.title}" style="width:100%;height:auto;display:block" loading="lazy"></div>`;
  }

  // 3. Relaterede værker
  if (w.related && w.related.length) {
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Relaterede værker</div><div style="display:flex;flex-direction:column;gap:6px">`;
    for (const rw of w.related) {
      sb += `<a href="work.html?reg=${rw.reg}" class="chip" style="font-size:0.78rem;background:var(--color-accent-light);border-color:var(--color-accent);color:var(--color-accent)">${rw.title}</a>`;
    }
    sb += `</div>`;
    if (w.author) sb += `<div style="margin-top:var(--sp3);font-size:0.78rem"><a href="person.html" style="color:var(--color-accent)">← Alle værker af ${w.author}</a></div>`;
    sb += `</div>`;
  }

  // 4. Autoritetslinks
  if (w.wd) {
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Autoritetslinks</div><div style="display:flex;flex-direction:column;gap:8px;font-size:0.82rem">`;
    sb += `<a href="https://www.wikidata.org/wiki/${w.wd}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px"><span class="wd-badge">wd:${w.wd}</span><span style="color:var(--color-text-muted)">Wikidata</span></a>`;
    sb += `<a href="https://www.worldcat.org/search?q=${encodeURIComponent(w.title)}" target="_blank" rel="noopener" style="color:inherit;display:flex;align-items:center;gap:6px"><span style="font-size:0.72rem;font-family:monospace;padding:1px 5px;border-radius:3px;background:var(--color-surface-2);border:1px solid var(--color-border)">OCLC</span><span style="color:var(--color-text-muted)">WorldCat</span></a>`;
    sb += `</div></div>`;
  }

  // 5. Hyppigst samtidige steder
  if (w.coPlaces && w.coPlaces.length) {
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Hyppigst samtidige steder</div><div style="display:flex;flex-direction:column;gap:6px">`;
    for (const pl of w.coPlaces) {
      sb += `<div style="display:flex;justify-content:space-between;align-items:center">`;
      sb += `<span style="display:inline-flex;align-items:center;gap:4px"><a href="place.html" class="chip chip--place">${pl.label}</a>`;
      if (pl.wd) sb += `<a href="https://www.wikidata.org/wiki/${pl.wd}" class="wd-badge" target="_blank" rel="noopener" title="${pl.label} på Wikidata">${pl.wd}</a>`;
      sb += `</span><span style="font-size:0.75rem;color:var(--color-text-muted)">${pl.count}</span></div>`;
    }
    sb += `</div></div>`;
  }

  document.getElementById('js-sidebar').innerHTML = sb;

  // ── Main content ─────────────────────────────────────────────────────────
  let main = '';

  // LOD callout
  if (w.wd) {
    main += `<div class="lod-callout"><strong>Linked Open Data (LOD)</strong> — Enhederne på denne side er beriget med autoritetsidentifikatorer, der forbinder registret til det globale vidensgraf-netværk.<div class="lod-bridge"><span class="lod-node lod-node--local">${reg}</span><span class="lod-node lod-node--owl">→ owl:sameAs →</span><a href="https://www.wikidata.org/wiki/${w.wd}" class="lod-node lod-node--wd" target="_blank" rel="noopener">wikidata:${w.wd}</a><span class="lod-node lod-node--owl">→ sameAs →</span><span class="lod-node lod-node--local" style="color:var(--color-text-muted)">VIAF · BnF · GND · …</span></div></div>`;
  }

  // Diary entries header
  main += `<div class="results-header"><span class="results-count"><strong>${w.refs}</strong> poster i dagbøgerne til ${w.title}</span><div class="layout-switcher"><button class="layout-switcher__btn layout-switcher__btn--active" data-layout="list">Liste</button><button class="layout-switcher__btn" data-layout="grid">Gitter</button></div></div>`;

  // Diary entries
  main += `<div style="display:flex;flex-direction:column;gap:var(--sp4)">`;
  for (const entry of w.diary) {
    let chipHtml = '';
    for (const c of entry.chips) {
      const href = c.type === 'place' ? 'place.html' : 'person.html';
      const cls  = c.type === 'place' ? 'chip chip--place' : 'chip chip--person';
      chipHtml += `<a href="${href}" class="${cls}">${c.label}</a>`;
      if (c.wd) chipHtml += `<a href="https://www.wikidata.org/wiki/${c.wd}" class="wd-badge" target="_blank" rel="noopener" title="${c.label} på Wikidata">${c.wd}</a>`;
    }
    main += `<a href="entry.html" class="result-card" style="padding:var(--sp4)"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><div class="result-card__title" style="font-size:0.95rem">${entry.date}</div><div style="font-family:monospace;font-size:0.72rem;color:var(--color-text-muted)">${entry.pag}</div></div><div style="font-size:0.84rem;color:var(--color-text-muted);font-style:italic;margin-bottom:8px;line-height:1.5">${entry.text}</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${chipHtml}</div></a>`;
  }
  main += `</div>`;

  // Co-occurring works
  if (w.coWorks && w.coWorks.length) {
    main += `<div style="margin-top:var(--sp8)"><h2 class="section-title">Samtidige værker</h2><p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">Værker der optræder i de samme dagbogsider som ${w.title}</p><div class="network-chips">`;
    for (const cw of w.coWorks) {
      const cwReg = TITLE_TO_REG[cw];
      const cwHref = cwReg ? `work.html?reg=${cwReg}` : 'work.html';
      main += `<a href="${cwHref}" class="chip" style="background:var(--color-accent-light);border-color:var(--color-accent);color:var(--color-accent)">${cw}</a>`;
    }
    main += `</div></div>`;
  }

  document.getElementById('js-main').innerHTML = main;
})();
</script>
