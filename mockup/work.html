<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Værk — HCA Open Repository</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .wd-badge {
      display: inline-block; font-size: 0.63rem; font-family: monospace;
      font-weight: 600; padding: 1px 5px; border-radius: 3px;
      background: #edf4fb; border: 1px solid #93bcd9; color: #2a5e8a;
      text-decoration: none; white-space: nowrap; vertical-align: middle; line-height: 1.7;
    }
    .wd-badge:hover { background: #d4e8f5; border-color: #3a7fb5; color: #1a4a72; }
    .lod-callout {
      background: #edf4fb; border: 1px solid #93bcd9;
      border-radius: var(--radius-lg); padding: var(--sp4) var(--sp5);
      margin-bottom: var(--sp5); font-size: 0.81rem;
      color: var(--color-text-muted); line-height: 1.6;
    }
    .lod-callout strong { color: #1a4a72; }
    .lod-bridge {
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; margin-top: var(--sp3); font-size: 0.77rem;
    }
    .lod-node {
      padding: 2px 8px; border-radius: 4px;
      font-family: monospace; font-weight: 600;
    }
    .lod-node--local { background: var(--color-surface-2); border: 1px solid var(--color-border); color: var(--color-text); }
    .lod-node--wd { background: #edf4fb; border: 1px solid #93bcd9; color: #2a5e8a; }
    .lod-node--owl { color: var(--color-text-muted); font-size: 0.8rem; }
    .sidebar-box {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--sp5); margin-bottom: var(--sp5);
    }
    .sidebar-box__title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--color-text-muted); margin-bottom: var(--sp3);
    }
    .register-dl {
      font-size: 0.83rem; display: grid;
      grid-template-columns: auto 1fr; gap: 4px 12px;
    }
    .register-dl dt { color: var(--color-text-muted); font-weight: 600; }
    .register-dl dd { margin: 0; }
  </style>
</head>
<body data-section="hvad">

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">HCA Open Repository</a>
    <form class="search-form" role="search" onsubmit="return false">
      <input type="search" placeholder="Søg i registre, dagbøger, steder…" class="search-input">
      <button type="submit" class="search-btn">Søg</button>
    </form>
  </div>
</header>

<main>

  <div class="page-hero page-hero--sm">
    <div class="container">
      <nav id="js-breadcrumb" class="breadcrumb" style="opacity:0.72;margin-bottom:6px"></nav>
      <h1 id="js-title"></h1>
      <div id="js-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
      <div id="js-meta" class="page-hero__meta"></div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="browse-layout">
        <aside id="js-sidebar" style="min-width:220px;max-width:260px"></aside>
        <div id="js-main"></div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    Udarbejdet af citizen scientists i samarbejde med
    <a href="https://www.sdu.dk/hca" style="color:inherit">H.C. Andersen Centret, Syddansk Universitet, Odense</a>
    &nbsp;·&nbsp; <a href="om.html" style="color:inherit">Vores kilder</a>
  </div>
</footer>

// Build title→reg reverse index for co-work linking
const TITLE_TO_REG = {};
for (const [reg, w] of Object.entries(WORKS)) TITLE_TO_REG[w.title] = reg;

function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Cross-entity lookups (personHref / placeHref / nameKey / worksByAuthor …)

// existing template literals stay terse.
const personHref = EntityRefs.personHref;
const placeHref  = EntityRefs.placeHref;

function wdBadge(q, label) {
  return `<a href="https://www.wikidata.org/wiki/${q}" class="wd-badge" target="_blank" rel="noopener" title="${label||q} på Wikidata">wd:${q}</a>`;
}

// entities.csv via scripts/build_mockup/build_works_extra.py) — so any
// ?reg=… link from a category page resolves to real metadata even when
// no hand-curated entry exists.
const ALL_WORKS = Object.assign({}, (typeof WORKS_EXTRA !== 'undefined' ? WORKS_EXTRA : {}), WORKS);

  const w = ALL_WORKS[reg];

  if (!w) {
    document.getElementById('js-title').textContent = 'Ukendt værk — ' + reg;
    return;
  }

  // Derive co-place / co-work fallbacks from cooccurrence.js when the
  // curated WORKS entry didn't supply them. Curated wins; this lights up
  // the same render path for the ~3,700 auto-generated works too.
  let coPlaces = (w.coPlaces && w.coPlaces.length) ? w.coPlaces : null;
  if (!coPlaces && typeof WORK_TOP_PLACES !== 'undefined' && WORK_TOP_PLACES[reg]) {
    coPlaces = WORK_TOP_PLACES[reg].map(([prid, n]) => {
      const pe = (typeof PLACES_EXTRA !== 'undefined') ? PLACES_EXTRA[prid] : null;
      return {
        rid: prid,
        label: (pe && pe.label) || prid,
        count: n + ' gange'
      };
    });
  }
  let coWorks = (w.coWorks && w.coWorks.length) ? w.coWorks : null;
  if (!coWorks && typeof WORK_TOP_WORKS !== 'undefined' && WORK_TOP_WORKS[reg]) {
    coWorks = WORK_TOP_WORKS[reg].map(([wrid, n]) => {
      const we = (typeof WORKS_EXTRA !== 'undefined') ? WORKS_EXTRA[wrid] : null;
      return { rid: wrid, title: (we && we.title) || wrid, count: n };
    });
  }

  // Source-derived fields (year_derived / date_derived / see / see_also) live
  // on the generated WORKS_EXTRA entry. Curated WORKS rarely set them, so fall
  // back to the extra record for the same reg.
  const wx = (typeof WORKS_EXTRA !== 'undefined') ? WORKS_EXTRA[reg] : null;
  const dispYear = w.year || (wx && wx.year) || null;
  const dispDate = w.date || (wx && wx.date) || null;
  const seeRefs = (w.see && w.see.length) ? w.see : (wx && wx.see) || [];
  const seeAlsoRefs = (w.seeAlso && w.seeAlso.length) ? w.seeAlso : (wx && wx.seeAlso) || [];

  document.title = w.title + ' — HCA Open Repository';

  // Breadcrumb
  document.getElementById('js-breadcrumb').innerHTML =
    `<a href="index.html">Forside</a>` +
    `<span class="breadcrumb__sep">›</span>` +
    `<a href="${w.wing}">${w.wingLabel}</a>` +
    `<span class="breadcrumb__sep">›</span>` +
    `<span style="color:var(--color-text-muted)">${w.h3}</span>` +
    `<span class="breadcrumb__sep">›</span>` +
    `<span class="breadcrumb__current">${w.title}</span>`;

  // Hero title + chips
  document.getElementById('js-title').textContent = w.title;
  let chips = `<span class="chip">${w.h2}</span><span class="chip">${w.h3}</span><span class="chip chip--work">${reg}</span>`;
  if (w.wd) chips += wdBadge(w.wd, w.title);
  document.getElementById('js-chips').innerHTML = chips;

  // Hero meta
  const metaItems = [`${w.refs} poster i dagbøgerne`, `${w.wingLabel} · ${w.h3}`];
  if (w.lang) metaItems.push(w.lang);
  document.getElementById('js-meta').innerHTML = metaItems.map(m => `<span>${m}</span>`).join('');

  // ── Sidebar ──────────────────────────────────────────────────────────────
  let sb = '';

  // 1. Registeroplysninger
  sb += `<div class="sidebar-box"><div class="sidebar-box__title">Registeroplysninger</div><dl class="register-dl">`;
  sb += `<dt>ID</dt><dd style="font-family:monospace">${reg}</dd>`;
  sb += `<dt>H1</dt><dd>VÆRK-REGISTER</dd>`;
  sb += `<dt>H2</dt><dd>${w.h2}</dd>`;
  sb += `<dt>H3</dt><dd>${w.h3}</dd>`;
  if (w.author) {
    sb += `<dt>person</dt><dd><a href="${personHref(w.author)}" style="color:var(--color-accent)">${w.author}</a>`;
    if (w.authorWd) sb += ` ${wdBadge(w.authorWd, w.author)}`;
    sb += `</dd>`;
  }
  if (w.lang) sb += `<dt>Originalsprog</dt><dd>${w.lang}</dd>`;
  if (dispDate) {
    sb += `<dt>Dateret</dt><dd>${dispDate}</dd>`;
  } else if (dispYear) {
    sb += `<dt>År</dt><dd>${dispYear}</dd>`;
  }
  sb += `<dt>Antal refs.</dt><dd>${w.refs}</dd>`;
  sb += `</dl></div>`;

  // 2. Image
  if (w.image) {
    sb += `<div class="sidebar-box" style="padding:0;overflow:hidden"><img src="${w.image}" alt="${w.title}" style="width:100%;height:auto;display:block" loading="lazy"></div>`;
  }

  // 3. Relaterede værker
  if (w.related && w.related.length) {
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Relaterede værker</div><div style="display:flex;flex-direction:column;gap:6px">`;
    for (const rw of w.related) {
      sb += `<a href="work.html?reg=${rw.reg}" class="chip" style="font-size:0.78rem;background:var(--color-accent-light);border-color:var(--color-accent);color:var(--color-accent)">${rw.title}</a>`;
    }
    sb += `</div>`;
    if (w.author) sb += `<div style="margin-top:var(--sp3);font-size:0.78rem"><a href="${personHref(w.author)}" style="color:var(--color-accent)">← Alle værker af ${w.author}</a></div>`;
    sb += `</div>`;
  }

  // 3b. Krydshenvisninger (see / see_also fra registret)
  if ((seeRefs && seeRefs.length) || (seeAlsoRefs && seeAlsoRefs.length)) {
    const refRow = (ref, verb) => {
      const inner = ref.rid
        ? `<a href="work.html?reg=${ref.rid}" class="chip" style="font-size:0.78rem;background:var(--color-accent-light);border-color:var(--color-accent);color:var(--color-accent)">${ref.label}</a>`
        : `<span class="chip" style="font-size:0.78rem" title="Ingen registerpost fundet">${ref.label}</span>`;
      return `<div style="display:flex;gap:6px;align-items:center"><span style="font-size:0.72rem;color:var(--color-text-muted);min-width:3.6em">${verb}</span>${inner}</div>`;
    };
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Krydshenvisninger</div><div style="display:flex;flex-direction:column;gap:6px">`;
    for (const r of (seeRefs || [])) sb += refRow(r, 'Se');
    for (const r of (seeAlsoRefs || [])) sb += refRow(r, 'Se også');
    sb += `</div></div>`;
  }

  // 4. Autoritetslinks
  if (w.wd) {
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Autoritetslinks</div><div style="display:flex;flex-direction:column;gap:8px;font-size:0.82rem">`;
    sb += `<a href="https://www.wikidata.org/wiki/${w.wd}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px"><span class="wd-badge">wd:${w.wd}</span><span style="color:var(--color-text-muted)">Wikidata</span></a>`;
    sb += `<a href="https://www.worldcat.org/search?q=${encodeURIComponent(w.title)}" target="_blank" rel="noopener" style="color:inherit;display:flex;align-items:center;gap:6px"><span style="font-size:0.72rem;font-family:monospace;padding:1px 5px;border-radius:3px;background:var(--color-surface-2);border:1px solid var(--color-border)">OCLC</span><span style="color:var(--color-text-muted)">WorldCat</span></a>`;
    sb += `</div></div>`;
  }

  // 5. Hyppigst samtidige steder
  if (coPlaces && coPlaces.length) {
    sb += `<div class="sidebar-box"><div class="sidebar-box__title">Hyppigst samtidige steder</div><div style="display:flex;flex-direction:column;gap:6px">`;
    for (const pl of coPlaces) {
      const href = pl.rid ? EntityRefs.placeHrefByRid(pl.rid) : placeHref(pl.label);
      sb += `<div style="display:flex;justify-content:space-between;align-items:center">`;
      sb += `<span style="display:inline-flex;align-items:center;gap:4px"><a href="${href}" class="chip chip--place">${pl.label}</a>`;
      if (pl.wd) sb += `<a href="https://www.wikidata.org/wiki/${pl.wd}" class="wd-badge" target="_blank" rel="noopener" title="${pl.label} på Wikidata">${pl.wd}</a>`;
      sb += `</span><span style="font-size:0.75rem;color:var(--color-text-muted)">${pl.count}</span></div>`;
    }
    sb += `</div></div>`;
  }

  document.getElementById('js-sidebar').innerHTML = sb;

  // ── Main content ─────────────────────────────────────────────────────────
  let main = '';

  // LOD callout
  if (w.wd) {
    main += `<div class="lod-callout"><strong>Linked Open Data (LOD)</strong> — Enhederne på denne side er beriget med autoritetsidentifikatorer, der forbinder registret til det globale vidensgraf-netværk.<div class="lod-bridge"><span class="lod-node lod-node--local">${reg}</span><span class="lod-node lod-node--owl">→ owl:sameAs →</span><a href="https://www.wikidata.org/wiki/${w.wd}" class="lod-node lod-node--wd" target="_blank" rel="noopener">wikidata:${w.wd}</a><span class="lod-node lod-node--owl">→ sameAs →</span><span class="lod-node lod-node--local" style="color:var(--color-text-muted)">VIAF · BnF · GND · …</span></div></div>`;
  }

  // Diary mentions — data-driven from DIARY_REFS, links to real generated pages.
  main += `<div id="js-reg-diary"></div>`;

  // Co-occurring works
  if (coWorks && coWorks.length) {
    main += `<div style="margin-top:var(--sp8)"><h2 class="section-title">Samtidige værker</h2><p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">Værker der optræder i de samme dagbogsider som ${w.title}</p><div class="network-chips">`;
    for (const cw of coWorks) {
      // Two shapes: curated coWorks = bare title string; derived = {rid, title, count}.
      const title = (typeof cw === 'string') ? cw : cw.title;
      const cwHref = (typeof cw === 'object' && cw.rid)
        ? EntityRefs.workHrefByRid(cw.rid)
        : (TITLE_TO_REG[title] ? `work.html?reg=${TITLE_TO_REG[title]}` : EntityRefs.workHref(title));
      main += `<a href="${cwHref}" class="chip" style="background:var(--color-accent-light);border-color:var(--color-accent);color:var(--color-accent)">${title}</a>`;
    }
    main += `</div></div>`;
  }

  document.getElementById('js-main').innerHTML = main;

  const regBox = document.getElementById('js-reg-diary');
  if (regBox) {
    const hasData = typeof DiaryWire !== 'undefined' &&
                    typeof DIARY_REFS !== 'undefined' && DIARY_REFS[reg];
    if (hasData) {
      const total = DIARY_REFS[reg].n;
      regBox.innerHTML =
        `<div class="results-header"><span class="results-count" style="flex:1"><strong>${total}</strong> dagbogsside${total === 1 ? '' : 'r'} omtaler ${escAttr(w.title)}</span>` +
        `<div class="layout-switcher" id="js-reg-diary-switcher">` +
        `<button class="layout-switcher__btn layout-switcher__btn--active" data-layout="list">☰ Liste</button>` +
        `<button class="layout-switcher__btn" data-layout="grid">⊞ Gitter</button>` +
        `</div></div>` +
        `<div class="result-grid" id="js-reg-diary-grid"></div>` +
        `<div style="text-align:center;margin-top:var(--sp5)"><button id="js-reg-diary-more" class="layout-switcher__btn" style="display:none;padding:7px 20px">Vis flere</button></div>`;
      const savedLayout = (() => { try { return localStorage.getItem('diary-layout') || 'list'; } catch(e) { return 'list'; } })();
      const diaryResult = DiaryWire.refs(
        document.getElementById('js-reg-diary-grid'), reg,
        { pageSize: 24, layout: savedLayout, moreBtn: document.getElementById('js-reg-diary-more') }
      );
      const sw = document.getElementById('js-reg-diary-switcher');
      if (diaryResult && sw) {
        sw.querySelectorAll('[data-layout]').forEach(b => {
          b.classList.toggle('layout-switcher__btn--active', b.dataset.layout === savedLayout);
        });
        sw.addEventListener('click', ev => {
          const btn = ev.target.closest('[data-layout]');
          if (!btn) return;
          const nl = btn.dataset.layout;
          diaryResult.setLayout(nl);
          try { localStorage.setItem('diary-layout', nl); } catch(e) {}
          sw.querySelectorAll('[data-layout]').forEach(b => {
            b.classList.toggle('layout-switcher__btn--active', b === btn);
          });
        });
      }
    } else {
      regBox.innerHTML =
        `<div class="results-header"><span class="results-count">Ingen dagbogsomtaler fundet for ${w.title}</span></div>`;
    }
  }
})();
</script>
</body>
</html>
