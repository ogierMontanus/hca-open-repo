<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sted — H.C. Andersen Dagbogsregister</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet — loaded eagerly; init runs only when the entity has coordinates. -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <style>
    .wd-badge {
      display: inline-block; font-size: 0.63rem; font-family: monospace;
      font-weight: 600; padding: 1px 5px; border-radius: 3px;
      background: #edf4fb; border: 1px solid #93bcd9; color: #2a5e8a;
      text-decoration: none; white-space: nowrap; vertical-align: middle; line-height: 1.7;
    }
    .wd-badge:hover { background: #d4e8f5; border-color: #3a7fb5; color: #1a4a72; }
    .map-leaflet { height: 320px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
    .map-meta { font-size: 0.78rem; color: var(--color-text-muted); margin-top: var(--sp2); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">H.C. Andersen Dagbogsregister</a>
    <form class="search-form" role="search" onsubmit="return false">
      <input type="search" placeholder="Søg i registre, dagbøger, steder…" class="search-input">
      <button type="submit" class="search-btn">Søg</button>
    </form>
  </div>
</header>

<main>

  <div class="page-hero page-hero--sm">
    <div class="container">
      <nav id="js-breadcrumb" class="breadcrumb" style="opacity:0.72;margin-bottom:6px"></nav>
      <h1 id="js-title"></h1>
      <div id="js-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
      <div id="js-meta" class="page-hero__meta"></div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="entity-layout">
        <div class="entity-main" id="js-main"></div>
        <aside class="entity-sidebar" id="js-sidebar"></aside>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    Udarbejdet af citizen scientists i samarbejde med
    <a href="https://www.sdu.dk/hca" style="color:inherit">H.C. Andersen Centret, Syddansk Universitet, Odense</a>
    &nbsp;·&nbsp; <a href="om.html" style="color:inherit">Vores kilder</a>
  </div>
</footer>

<script src="js/nav.js"></script>
<!-- Generated per-entity extras (gitignored). Build with the build_*_extra.py scripts.
     places-extra.js powers the page itself; works-extra.js + persons-extra.js
     are loaded so EntityRefs can render the "Værker" and "Personer" sections. -->
<script src="data/places-extra.js" onerror="void 0"></script>
<script src="data/works-extra.js" onerror="void 0"></script>
<script src="data/persons-extra.js" onerror="void 0"></script>
<script src="js/entity-refs.js"></script>
<!-- Co-occurrence index for "Hyppigste …" sections (gitignored).
     Build with: python scripts/build_mockup/build_cooccurrence.py -->
<script src="data/cooccurrence.js" onerror="void 0"></script>
<!-- Generated diary data (gitignored). Build with:
     python scripts/build_mockup/build_diary_index.py -->
<script src="data/diary-index.js" onerror="void 0"></script>
<script src="data/diary-refs.js" onerror="void 0"></script>
<script src="js/diary-wire.js"></script>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
/* Hand-curated PLACES — takes precedence over generated PLACES_EXTRA.
   Mirrors WORKS / PERSONS curation pattern. Use to override a
   destination_en, supply a Wikidata Q-number, or replace the auto-
   country-attribution from the bbox gazetteer with a better label. */
const PLACES = {
  'Reg0017430': {
    label: 'Rom',
    destination_en: 'Rome',
    country_da: 'Italien',
    lat: 41.90332, lon: 12.49565,
    wd: 'Q220',
    description: "Italiens hovedstad, et af Andersens vigtigste rejsemål; " +
                 "han opholdt sig her i lange perioder, særligt 1833–34 og 1840–41."
  }
};

const ALL_PLACES = Object.assign(
  {}, (typeof PLACES_EXTRA !== 'undefined' ? PLACES_EXTRA : {}), PLACES
);

function escAttr(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

(function () {
  const params = new URLSearchParams(location.search);
  const reg = params.get('reg') || 'Reg0017430';   // default to Rom
  const pl = ALL_PLACES[reg];

  if (!pl) {
    document.getElementById('js-title').textContent = 'Ukendt sted — ' + reg;
    document.getElementById('js-breadcrumb').innerHTML =
      '<a href="index.html">Forside</a><span class="breadcrumb__sep">›</span>' +
      '<a href="places.html">Stedregister</a><span class="breadcrumb__sep">›</span>' +
      '<span class="breadcrumb__current">' + escAttr(reg) + '</span>';
    return;
  }

  document.title = pl.label + ' — H.C. Andersen Dagbogsregister';

  // Breadcrumb
  document.getElementById('js-breadcrumb').innerHTML =
    '<a href="index.html">Forside</a>' +
    '<span class="breadcrumb__sep">›</span>' +
    '<a href="places.html">Stedregister</a>' +
    '<span class="breadcrumb__sep">›</span>' +
    '<span class="breadcrumb__current">' + escAttr(pl.label) + '</span>';

  document.getElementById('js-title').textContent = pl.label;

  const hasCoords = pl.lat != null && pl.lon != null;
  let chips = '<span class="chip chip--place">STED-REGISTER</span>';
  if (pl.country_da) chips += '<span class="chip">' + escAttr(pl.country_da) + '</span>';
  chips += '<span class="chip" style="font-family:monospace">' + escAttr(reg) + '</span>';
  if (hasCoords) chips += '<span class="chip" title="Geokodet via hcax.dk Rejser">geokodet</span>';
  if (pl.wd) chips += '<a href="https://www.wikidata.org/wiki/' + escAttr(pl.wd) +
    '" class="wd-badge" target="_blank" rel="noopener" title="' + escAttr(pl.label) +
    ' på Wikidata">wd:' + escAttr(pl.wd) + '</a>';
  document.getElementById('js-chips').innerHTML = chips;

  // Hero meta
  const metaItems = [];
  if (pl.country_da) metaItems.push(pl.country_da);
  if (pl.destination_en && pl.destination_en !== pl.label) metaItems.push('a.k.a. ' + pl.destination_en);
  if (hasCoords) metaItems.push(pl.lat.toFixed(4) + ', ' + pl.lon.toFixed(4));
  const total = (typeof DIARY_REFS !== 'undefined' && DIARY_REFS[reg])
    ? DIARY_REFS[reg].n : (pl.refs || 0);
  metaItems.push(total + ' dagbogsreferencer');
  document.getElementById('js-meta').innerHTML =
    metaItems.map(m => '<span>' + escAttr(m) + '</span>').join('');

  // ── Sidebar ──────────────────────────────────────────────────────────────
  let sb = '';
  sb += '<div class="info-block"><div class="info-block__header">Registerdata</div><div class="info-block__body"><table class="info-table">';
  sb += '<tr><td>ID</td><td style="font-family:monospace">' + escAttr(reg) + '</td></tr>';
  sb += '<tr><td>Register</td><td>STED-REGISTER</td></tr>';
  sb += '<tr><td>Label</td><td>' + escAttr(pl.label) + '</td></tr>';
  if (pl.destination_en && pl.destination_en !== pl.label)
    sb += '<tr><td>English</td><td>' + escAttr(pl.destination_en) + '</td></tr>';
  if (pl.country_da) sb += '<tr><td>Land</td><td>' + escAttr(pl.country_da) + '</td></tr>';
  if (hasCoords)
    sb += '<tr><td>Koordinater</td><td style="font-family:monospace">' +
      pl.lat.toFixed(4) + ', ' + pl.lon.toFixed(4) + '</td></tr>';
  sb += '<tr><td>Dagbogsrefs.</td><td>' + total + '</td></tr>';
  sb += '</table></div></div>';

  if (pl.wd) {
    sb += '<div class="info-block"><div class="info-block__header">Autoritetslinks</div><div class="info-block__body" style="display:flex;flex-direction:column;gap:8px;font-size:0.82rem">';
    sb += '<a href="https://www.wikidata.org/wiki/' + escAttr(pl.wd) +
      '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px">' +
      '<span class="wd-badge">wd:' + escAttr(pl.wd) + '</span>' +
      '<span style="color:var(--color-text-muted)">Wikidata</span></a></div></div>';
  }
  document.getElementById('js-sidebar').innerHTML = sb;

  // ── Main content ─────────────────────────────────────────────────────────
  let main = '';
  if (hasCoords) {
    main += '<div><h2 class="section-title">Kort</h2>' +
      '<div id="place-map" class="map-leaflet" aria-label="Kort over ' + escAttr(pl.label) + '"></div>' +
      '<p class="map-meta">Koordinater fra hcax.dk Rejser add-on · ' +
      pl.lat.toFixed(4) + '° N, ' + pl.lon.toFixed(4) + '° Ø &nbsp;·&nbsp; ' +
      '<a href="kort.html#reg=' + escAttr(reg) + '" style="color:var(--color-accent)">' +
      'Vis på samlet kort →</a></p></div>';
  } else {
    main += '<div><p class="muted" style="font-style:italic">Ikke geokodet — dette sted findes ikke i hcax.dk Rejser-tabellen.</p></div>';
  }

  if (pl.description) {
    main += '<div><h2 class="section-title">Beskrivelse</h2>' +
      '<p style="font-size:0.92rem;line-height:1.75;max-width:640px">' +
      escAttr(pl.description) + '</p></div>';
  }

  // ── Værker knyttet til dette sted ───────────────────────────────────────
  // Works whose title parenthetical names this place (e.g.
  // "Den mediceiske Venus (Uffizi, Firenze)"). Section hides if empty.
  const myWorks = (typeof EntityRefs !== 'undefined') ? EntityRefs.worksAtPlace(reg) : [];
  if (myWorks.length) {
    const byH3 = {};
    for (const w of myWorks) {
      const k = w.h3 || '—';
      (byH3[k] = byH3[k] || []).push(w);
    }
    for (const k in byH3) byH3[k].sort((a, b) => (b.refs || 0) - (a.refs || 0));
    const groups = Object.keys(byH3).sort((a, b) => {
      const ra = byH3[a].reduce((s, w) => s + (w.refs || 0), 0);
      const rb = byH3[b].reduce((s, w) => s + (w.refs || 0), 0);
      return rb - ra;
    });
    let block = '<div><h2 class="section-title">Værker</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      myWorks.length + ' værk' + (myWorks.length === 1 ? '' : 'er') +
      ' i registret er stedfæstet til ' + escAttr(pl.label) + '.</p>';
    for (const h3 of groups) {
      const items = byH3[h3];
      block += '<div style="margin-bottom:var(--sp5)">' +
        '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;' +
        'letter-spacing:0.08em;color:var(--color-text-muted);margin-bottom:8px">' +
        escAttr(h3) + ' <span style="opacity:0.7">(' + items.length + ')</span></div>' +
        '<ul style="list-style:none;padding:0;margin:0;display:grid;' +
        'grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 16px;font-size:0.88rem">';
      const visible = items.slice(0, 12);
      for (const w of visible) {
        block += '<li><a href="' + escAttr(EntityRefs.workHrefByRid(w.rid)) +
          '" style="color:var(--color-text)">' + escAttr(w.title) + '</a>' +
          (w.refs ? ' <span style="color:var(--color-text-muted);font-size:0.78rem">· ' +
            w.refs + ' ref.</span>' : '') + '</li>';
      }
      if (items.length > visible.length) {
        block += '<li style="color:var(--color-text-muted);font-style:italic">' +
          '+ ' + (items.length - visible.length) + ' yderligere</li>';
      }
      block += '</ul></div>';
    }
    block += '</div>';
    main += block;
  }

  // ── Hyppigste personer ──────────────────────────────────────────────────
  // Top persons that co-occur with this place on the same diary page.
  const topPersons = (typeof PLACE_TOP_PERSONS !== 'undefined' && PLACE_TOP_PERSONS[reg]) || [];
  if (topPersons.length) {
    let block = '<div><h2 class="section-title">Hyppigste personer</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      'Personer der oftest nævnes på samme dagbogsside som ' + escAttr(pl.label) + '.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    for (const [prid, n] of topPersons) {
      const lab = (typeof PERSONS_EXTRA !== 'undefined' && PERSONS_EXTRA[prid] && PERSONS_EXTRA[prid].label) || prid;
      block += '<a href="' + escAttr(EntityRefs.personHrefByRid(prid)) +
        '" class="chip chip--person" style="font-size:0.82rem">' +
        escAttr(lab) + ' <span style="opacity:0.7;font-size:0.74rem">· ' + n + '</span></a>';
    }
    block += '</div></div>';
    main += block;
  }

  main += '<div><h2 class="section-title">Dagbogsreferencer</h2>' +
    '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)" id="place-diary-summary">' +
    'Indlæser…</p>' +
    '<div class="result-grid" id="place-diary" data-reg="' + escAttr(reg) +
    '" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))"></div>' +
    '<div style="text-align:center;margin-top:var(--sp5)">' +
    '<button id="place-diary-more" class="layout-switcher__btn" style="display:none;padding:7px 20px">Vis flere</button>' +
    '</div></div>';

  document.getElementById('js-main').innerHTML = main;

  // Leaflet init when geocoded — CARTO Voyager tiles per CLAUDE.md.
  if (hasCoords && typeof L !== 'undefined') {
    const map = L.map('place-map').setView([pl.lat, pl.lon], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);
    L.marker([pl.lat, pl.lon]).addTo(map)
      .bindPopup('<b>' + escAttr(pl.label) + '</b><br>' +
        pl.lat.toFixed(4) + '° N, ' + pl.lon.toFixed(4) + '° Ø')
      .openPopup();
  }

  // Wire up the diary section
  const grid = document.getElementById('place-diary');
  const summary = document.getElementById('place-diary-summary');
  const result = DiaryWire.refs(grid, reg, {
    pageSize: 24,
    moreBtn: document.getElementById('place-diary-more'),
    onCount: function (shown, total) {
      if (summary) {
        summary.textContent = total === 0
          ? 'Ingen dagbogsreferencer registreret.'
          : 'Viser ' + shown + ' af ' + total + ' dagbogssider der omtaler ' +
            pl.label + '.';
      }
    }
  });
  if (!result && summary) {
    summary.textContent = 'Dagbogsdata ikke indlæst (kør build_diary_index.py).';
  }
})();
</script>
</body>
</html>
