<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sted — HCA Open Repository</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet — loaded eagerly; init runs only when the entity has coordinates. -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <style>
    .wd-badge {
      display: inline-block; font-size: 0.63rem; font-family: monospace;
      font-weight: 600; padding: 1px 5px; border-radius: 3px;
      background: #edf4fb; border: 1px solid #93bcd9; color: #2a5e8a;
      text-decoration: none; white-space: nowrap; vertical-align: middle; line-height: 1.7;
    }
    .wd-badge:hover { background: #d4e8f5; border-color: #3a7fb5; color: #1a4a72; }
    .map-leaflet { height: 320px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
    .map-meta { font-size: 0.78rem; color: var(--color-text-muted); margin-top: var(--sp2); }
  </style>
</head>
<body data-section="hvor">

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">HCA Open Repository</a>
    <form class="search-form" role="search" onsubmit="return false">
      <input type="search" placeholder="Søg i registre, dagbøger, steder…" class="search-input">
      <button type="submit" class="search-btn">Søg</button>
    </form>
    <span id="js-cart-badge"></span>
  </div>
</header>

<main>

  <div class="page-hero page-hero--sm">
    <div class="container">
      <nav id="js-breadcrumb" class="breadcrumb" style="opacity:0.72;margin-bottom:6px"></nav>
      <h1 id="js-title"></h1>
      <div id="js-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
      <div id="js-cart-toggle" style="margin-top:8px"></div>
      <div id="js-meta" class="page-hero__meta"></div>
    </div>
  </div>

  <section class="section">
    <div class="container" style="margin-left: 5vw;">
      <div class="entity-layout">
        <div class="entity-main" id="js-main"></div>
        <aside class="entity-sidebar" id="js-sidebar"></aside>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    Udarbejdet af citizen scientists i samarbejde med
    <a href="https://www.sdu.dk/hca" style="color:inherit">H.C. Andersen Centret, Syddansk Universitet, Odense</a>
    &nbsp;·&nbsp; <a href="om.html" style="color:inherit">Vores kilder</a>
  </div>
</footer>

<script src="js/nav.js"></script>
<!-- Generated per-entity extras (gitignored). Build with the build_*_extra.py scripts.
     places-extra.js powers the page itself; works-extra.js + persons-extra.js
     are loaded so EntityRefs can render the "Værker" and "Personer" sections. -->
<script src="data/places-extra.js" onerror="void 0"></script>
<script src="data/works-extra.js" onerror="void 0"></script>
<script src="data/persons-extra.js" onerror="void 0"></script>
<script src="js/entity-refs.js"></script>
<!-- Co-occurrence index for "Hyppigste …" sections (gitignored).
     Build with: python scripts/build_mockup/build_cooccurrence.py -->
<script src="data/cooccurrence.js" onerror="void 0"></script>
<!-- Generated diary data (gitignored). Build with:
     python scripts/build_mockup/build_diary_index.py -->
<script src="data/diary-index.js" onerror="void 0"></script>
<script src="data/diary-refs.js" onerror="void 0"></script>
<script src="js/diary-wire.js"></script>
<script src="data/nation-index.js" onerror="void 0"></script>
<script src="js/nation-link.js"></script>
<script src="js/cart.js"></script>
<!-- Dagbogsreferencer defaults to layout:'table' when no localStorage
     preference exists yet (see the diary-wire.js wiring below); without
     this script TableView is undefined, table mode silently falls back
     to the list renderer but the "Vis alle" button still thinks
     everything is already shown and stays hidden forever. -->
<script src="js/table-view.js"></script>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
/* Hand-curated PLACES — takes precedence over generated PLACES_EXTRA.
   Mirrors WORKS / PERSONS curation pattern. Use to override a
   destination_en, supply a Wikidata Q-number, or replace the auto-
   country-attribution from the bbox gazetteer with a better label. */
const PLACES = {
  'Reg0017430': {
    label: 'Rom',
    destination_en: 'Rome',
    country_da: 'Italien',
    lat: 41.90332, lon: 12.49565,
    wd: 'Q220',
    description: "Italiens hovedstad, et af Andersens vigtigste rejsemål; " +
                 "han opholdt sig her i lange perioder, særligt 1833–34 og 1840–41."
  }
};

const ALL_PLACES = Object.assign(
  {}, (typeof PLACES_EXTRA !== 'undefined' ? PLACES_EXTRA : {}), PLACES
);

function escAttr(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

(function () {
  if (typeof Cart !== 'undefined') {
    Cart.mountBadge(document.getElementById('js-cart-badge'));
    Cart.wireCheckboxes();
  }

  const params = new URLSearchParams(location.search);
  const reg = params.get('reg') || 'Reg0017430';   // default to Rom
  const pl = ALL_PLACES[reg];

  if (!pl) {
    document.getElementById('js-title').textContent = 'Ukendt sted — ' + reg;
    document.getElementById('js-breadcrumb').innerHTML =
      '<a href="index.html">Forside</a><span class="breadcrumb__sep">›</span>' +
      '<a href="places.html">Stedregister</a><span class="breadcrumb__sep">›</span>' +
      '<span class="breadcrumb__current">' + escAttr(reg) + '</span>';
    return;
  }

  if (typeof Cart !== 'undefined') {
    Cart.mountToggle(document.getElementById('js-cart-toggle'), 'place', reg, pl.label);
  }

  document.title = pl.label + ' — HCA Open Repository';

  // Breadcrumb ends in the internal ID, not the name — the name is
  // already the H1 right below. See docs/data-model/detail-page-redundancy.md.
  document.getElementById('js-breadcrumb').innerHTML =
    '<a href="index.html">Forside</a>' +
    '<span class="breadcrumb__sep">›</span>' +
    '<a href="places.html">Stedregister</a>' +
    '<span class="breadcrumb__sep">›</span>' +
    '<span class="breadcrumb__current" style="font-family:monospace">' + escAttr(reg) + '</span>';

  document.getElementById('js-title').textContent = pl.label;

  const hasCoords = pl.lat != null && pl.lon != null;
  // No chip row: register-type/ID/"geokodet" duplicated the breadcrumb and
  // the Kort section below; the wd chip duplicated the Autoritetslinks
  // sidebar block. See docs/data-model/detail-page-redundancy.md.
  document.getElementById('js-chips').style.display = 'none';

  // Hero meta keeps only what's shown nowhere else on the page: country and
  // the English exonym. Coordinates live with the map (Kort section) and
  // the hit count lives in the Dagbogsreferencer intro line below.
  const metaItems = [];
  if (pl.country_da) metaItems.push(pl.country_da);
  if (pl.destination_en && pl.destination_en !== pl.label) metaItems.push('a.k.a. ' + pl.destination_en);
  document.getElementById('js-meta').innerHTML = metaItems.length
    ? metaItems.map(m => '<span>' + escAttr(m) + '</span>').join('')
    : '';
  if (!metaItems.length) document.getElementById('js-meta').style.display = 'none';

  // ── Sidebar — Registerdata is not repeated here: ID/register-type/label
  // are shown via the breadcrumb and H1, country/English via the hero meta,
  // coordinates via the Kort section, and the hit count via the
  // Dagbogsreferencer intro. Only genuinely-added data (Wikidata) gets a
  // sidebar block. See docs/data-model/detail-page-redundancy.md. ──────────
  let sb = '';
  if (pl.wd) {
    sb += '<div class="info-block info-block--enriched"><div class="info-block__header">Autoritetslinks<span class="info-block__tag">tilføjet</span></div><div class="info-block__body" style="display:flex;flex-direction:column;gap:8px;font-size:0.82rem">';
    sb += '<a href="https://www.wikidata.org/wiki/' + escAttr(pl.wd) +
      '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px">' +
      '<span class="wd-badge">wd:' + escAttr(pl.wd) + '</span>' +
      '<span style="color:var(--color-text-muted)">Wikidata</span></a></div></div>';
  }
  document.getElementById('js-sidebar').innerHTML = sb;

  // ── Main content ─────────────────────────────────────────────────────────
  let main = '';
  if (hasCoords) {
    main += '<div><h2 class="section-title">Kort</h2>' +
      '<div id="place-map" class="map-leaflet" aria-label="Kort over ' + escAttr(pl.label) + '"></div>' +
      '<p class="map-meta">Koordinater fra hcax.dk Rejser add-on · ' +
      pl.lat.toFixed(4) + '° N, ' + pl.lon.toFixed(4) + '° Ø &nbsp;·&nbsp; ' +
      '<a href="kort.html#reg=' + escAttr(reg) + '" style="color:var(--color-accent)">' +
      'Vis på samlet kort →</a></p></div>';
  } else {
    main += '<div><p class="muted" style="font-style:italic">Ikke geokodet — dette sted findes ikke i hcax.dk Rejser-tabellen.</p></div>';
  }

  // ── Nation-krydslink ────────────────────────────────────────────────────
  // Second block from the top, above Beskrivelse / Værker / Hyppigste: from
  // a German place, offer every German place *and* person in one view.
  // Emits nothing when the place has no country or nation-index.js is absent.
  if (typeof NationLink !== 'undefined' && pl.country_da) {
    main += NationLink.html(NationLink.byCountry(pl.country_da),
      escAttr(pl.label) + ' ligger i ' + escAttr(pl.country_da));
  }

  if (pl.description) {
    main += '<div><h2 class="section-title">Beskrivelse</h2>' +
      '<p style="font-size:0.92rem;line-height:1.75;max-width:640px">' +
      escAttr(pl.description) + '</p></div>';
  }

  // ── Værker knyttet til dette sted ───────────────────────────────────────
  // Works whose title parenthetical names this place (e.g.
  // "Den mediceiske Venus (Uffizi, Firenze)"). Section hides if empty.
  const myWorks = (typeof EntityRefs !== 'undefined') ? EntityRefs.worksAtPlace(reg) : [];
  if (myWorks.length) {
    const byH3 = {};
    for (const w of myWorks) {
      const k = w.h3 || '—';
      (byH3[k] = byH3[k] || []).push(w);
    }
    for (const k in byH3) byH3[k].sort((a, b) => (b.refs || 0) - (a.refs || 0));
    const groups = Object.keys(byH3).sort((a, b) => {
      const ra = byH3[a].reduce((s, w) => s + (w.refs || 0), 0);
      const rb = byH3[b].reduce((s, w) => s + (w.refs || 0), 0);
      return rb - ra;
    });
    let block = '<div><h2 class="section-title">Værker</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      myWorks.length + ' værk' + (myWorks.length === 1 ? '' : 'er') +
      ' i registret er stedfæstet til ' + escAttr(pl.label) + '.</p>';
    // Every item is rendered up front (not fetched on demand); items past
    // the 12-cap just start hidden, revealed by the delegated click
    // handler below in one click — was previously inert "+ N yderligere"
    // text with no way to actually see the rest.
    let werkerGroupIdx = 0;
    for (const h3 of groups) {
      const items = byH3[h3];
      const gid = 'w' + (werkerGroupIdx++);
      block += '<div style="margin-bottom:var(--sp5)">' +
        '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;' +
        'letter-spacing:0.08em;color:var(--color-text-muted);margin-bottom:8px">' +
        escAttr(h3) + ' <span style="opacity:0.7">(' + items.length + ')</span></div>' +
        '<ul style="list-style:none;padding:0;margin:0;display:grid;' +
        'grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 16px;font-size:0.88rem">';
      items.forEach((w, i) => {
        const hiddenAttrs = i >= 12 ? ' style="display:none" data-werker-extra="' + gid + '"' : '';
        block += '<li' + hiddenAttrs + '><a href="' + escAttr(EntityRefs.workHrefByRid(w.rid)) +
          '" style="color:var(--color-text)">' + escAttr(w.title) + '</a>' +
          (w.refs ? ' <span style="color:var(--color-text-muted);font-size:0.78rem">· ' +
            w.refs + ' ref.</span>' : '') + '</li>';
      });
      if (items.length > 12) {
        block += '<li data-werker-more="' + gid + '"><button type="button" ' +
          'style="background:none;border:none;padding:0;color:var(--color-accent);' +
          'cursor:pointer;font:inherit;text-decoration:underline">Vis alle (' +
          (items.length - 12) + ' flere) →</button></li>';
      }
      block += '</ul></div>';
    }
    block += '</div>';
    main += block;
  }

  // ── Dagbogsreferencer ────────────────────────────────────────────────────
  // Above Hyppigste personer / Nævnt sammen med: the diary pages that
  // actually mention this place are the primary evidence, so they come
  // before derived co-occurrence stats (2026-08-29 layout preference,
  // applies to every reg=-page's Dagbogsreferencer block).
  main += '<div><h2 class="section-title">Dagbogsreferencer</h2>' +
    '<div class="results-header">' +
    '<p id="place-diary-summary" style="font-size:0.83rem;color:var(--color-text-muted);margin:0;flex:1">Indlæser…</p>' +
    '<div class="layout-switcher" id="place-diary-switcher">' +
    '<button class="layout-switcher__btn" data-layout="list">☰ Liste</button>' +
    '<button class="layout-switcher__btn layout-switcher__btn--active" data-layout="table">▦ Tabel</button>' +
    '</div></div>' +
    '<div class="result-grid" id="place-diary"></div>' +
    '<div style="text-align:center;margin-top:var(--sp5)">' +
    '<button id="place-diary-more" class="layout-switcher__btn" style="display:none;padding:7px 20px">Vis flere</button>' +
    '</div></div>';

  // ── Hyppigste personer ──────────────────────────────────────────────────
  // Top persons that co-occur with this place on the same diary page.
  const topPersons = (typeof PLACE_TOP_PERSONS !== 'undefined' && PLACE_TOP_PERSONS[reg]) || [];
  if (topPersons.length) {
    let block = '<div><h2 class="section-title">Hyppigste personer</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      'Personer der oftest nævnes på samme dagbogsside som ' + escAttr(pl.label) + '.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    for (const [prid, n] of topPersons) {
      const lab = (typeof PERSONS_EXTRA !== 'undefined' && PERSONS_EXTRA[prid] && PERSONS_EXTRA[prid].label) || prid;
      block += '<a href="' + escAttr(EntityRefs.personHrefByRid(prid)) +
        '" class="chip chip--person" style="font-size:0.82rem">' +
        escAttr(lab) + ' <span style="opacity:0.7;font-size:0.74rem">· ' + n + '</span></a>';
    }
    block += '</div></div>';
    main += block;
  }

  // ── Nævnt sammen med (indgående) ────────────────────────────────────────
  // The return path for the person→place links rendered under "Hyppigste
  // steder" on a person's card. The relation is symmetric, but the top-12
  // cap is not: a hub like København crowds every minor companion out of
  // its own list, so 84 % of those links used to be one-way. These are
  // exactly the persons who carry THIS place among their own most frequent
  // places while not making this place's top-12 — kept as a separate,
  // separately-labelled group so the stronger top-12 above is not diluted.
  const inbound = (typeof PLACE_PERSON_INBOUND !== 'undefined' && PLACE_PERSON_INBOUND[reg]) || [];
  if (inbound.length) {
    main += '<div><h2 class="section-title">Nævnt sammen med</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      'Yderligere <strong>' + inbound.length.toLocaleString('da-DK') + '</strong> personer har ' +
      escAttr(pl.label) + ' blandt deres hyppigste steder, uden selv at nå ' +
      'top-listen ovenfor.</p>' +
      '<div id="place-inbound" style="display:flex;flex-wrap:wrap;gap:6px"></div>' +
      '<div style="text-align:center;margin-top:var(--sp4)">' +
      '<button id="place-inbound-more" class="layout-switcher__btn" style="padding:7px 20px">Vis flere</button>' +
      '</div></div>';
  }

  document.getElementById('js-main').innerHTML = main;

  // Værker "Vis alle" — one click reveals every remaining item in that
  // H3 group (see the block-building loop above); delegated since the
  // buttons are part of the innerHTML just assigned above, not yet in
  // the DOM when this script runs otherwise.
  document.addEventListener('click', function (ev) {
    const li = ev.target.closest('[data-werker-more]');
    if (!li) return;
    const gid = li.getAttribute('data-werker-more');
    document.querySelectorAll('[data-werker-extra="' + gid + '"]').forEach(function (el) {
      el.style.display = '';
    });
    li.remove();
  });

  // Initial render is capped to IN_PAGE for scan-ability (same convention
  // as Dagbogsreferencer's/Værker's own initial caps), but the button
  // itself is a one-click "show all" — not incremental pagination, so a
  // hub place's full inbound list never sits behind several clicks.
  if (inbound.length) {
    const inGrid = document.getElementById('place-inbound');
    const inMore = document.getElementById('place-inbound-more');
    const IN_PAGE = 40;
    let inShown = 0;
    const renderInbound = (count) => {
      const next = inbound.slice(inShown, inShown + count);
      inGrid.insertAdjacentHTML('beforeend', next.map(([prid, n]) => {
        const lab = (typeof PERSONS_EXTRA !== 'undefined' && PERSONS_EXTRA[prid] && PERSONS_EXTRA[prid].label) || prid;
        return '<a href="' + escAttr(EntityRefs.personHrefByRid(prid)) +
          '" class="chip chip--person" style="font-size:0.82rem">' +
          escAttr(lab) + ' <span style="opacity:0.7;font-size:0.74rem">· ' + n + '</span></a>';
      }).join(''));
      inShown += next.length;
      const remaining = inbound.length - inShown;
      inMore.style.display = remaining > 0 ? '' : 'none';
      if (remaining > 0) inMore.textContent = 'Vis alle (' + remaining.toLocaleString('da-DK') + ')';
    };
    inMore.addEventListener('click', function () { renderInbound(inbound.length - inShown); });
    renderInbound(IN_PAGE);
  }

  // Leaflet init when geocoded — CARTO Voyager tiles per CLAUDE.md.
  if (hasCoords && typeof L !== 'undefined') {
    const map = L.map('place-map').setView([pl.lat, pl.lon], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);
    L.marker([pl.lat, pl.lon]).addTo(map)
      .bindPopup('<b>' + escAttr(pl.label) + '</b><br>' +
        pl.lat.toFixed(4) + '° N, ' + pl.lon.toFixed(4) + '° Ø')
      .openPopup();
  }

  // Wire up the diary section
  const grid = document.getElementById('place-diary');
  const summary = document.getElementById('place-diary-summary');
  const switcher = document.getElementById('place-diary-switcher');
  const savedLayout = (() => { try { return localStorage.getItem('diary-layout') || 'table'; } catch(e) { return 'table'; } })();
  const result = DiaryWire.refs(grid, reg, {
    pageSize: 24,
    layout: savedLayout,
    moreBtn: document.getElementById('place-diary-more'),
    onCount: function (shown, total) {
      if (summary) {
        summary.textContent = total === 0
          ? 'Ingen dagbogsreferencer registreret.'
          : 'Viser ' + shown + ' af ' + total + ' dagbogssider der omtaler ' +
            pl.label + '.';
      }
    }
  });
  if (!result && summary) {
    summary.textContent = 'Dagbogsdata ikke indlæst (kør build_diary_index.py).';
  }
  if (result && switcher) {
    switcher.querySelectorAll('[data-layout]').forEach(b => {
      b.classList.toggle('layout-switcher__btn--active', b.dataset.layout === savedLayout);
    });
    switcher.addEventListener('click', ev => {
      const btn = ev.target.closest('[data-layout]');
      if (!btn) return;
      const nl = btn.dataset.layout;
      result.setLayout(nl);
      try { localStorage.setItem('diary-layout', nl); } catch(e) {}
      switcher.querySelectorAll('[data-layout]').forEach(b => {
        b.classList.toggle('layout-switcher__btn--active', b === btn);
      });
    });
  }
})();
</script>
</body>
</html>
