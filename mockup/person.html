<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Person — HCA Open Repository</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .wd-badge {
      display: inline-block; font-size: 0.63rem; font-family: monospace;
      font-weight: 600; padding: 1px 5px; border-radius: 3px;
      background: #edf4fb; border: 1px solid #93bcd9; color: #2a5e8a;
      text-decoration: none; white-space: nowrap; vertical-align: middle; line-height: 1.7;
    }
    .wd-badge:hover { background: #d4e8f5; border-color: #3a7fb5; color: #1a4a72; }
    .sidebar-box {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--sp5); margin-bottom: var(--sp5);
    }
    .sidebar-box__title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--color-text-muted); margin-bottom: var(--sp3);
    }
    .register-dl {
      font-size: 0.83rem; display: grid;
      grid-template-columns: auto 1fr; gap: 4px 12px;
    }
    .register-dl dt { color: var(--color-text-muted); font-weight: 600; }
    .register-dl dd { margin: 0; }
  </style>
</head>
<body data-section="hvem">

<header class="site-header">
  <div class="container">
    <a href="index.html" class="site-logo">HCA Open Repository</a>
    <form class="search-form" role="search" onsubmit="return false">
      <input type="search" placeholder="Søg i registre, dagbøger, steder…" class="search-input">
      <button type="submit" class="search-btn">Søg</button>
    </form>
    <div class="lang-switch">
      <a href="person.html" class="active">DA</a>
      <span style="color:var(--color-border)">|</span>
      <a href="person_en.html">EN</a>
    </div>
  </div>
</header>

<main>

  <div class="page-hero page-hero--sm">
    <div class="container">
      <nav id="js-breadcrumb" class="breadcrumb" style="opacity:0.72;margin-bottom:6px"></nav>
      <h1 id="js-title"></h1>
      <div id="js-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
      <div id="js-meta" class="page-hero__meta"></div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="entity-layout">
        <div class="entity-main" id="js-main"></div>
        <aside class="entity-sidebar" id="js-sidebar"></aside>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    Udarbejdet af citizen scientists i samarbejde med
    <a href="https://www.sdu.dk/hca" style="color:inherit">H.C. Andersen Centret, Syddansk Universitet, Odense</a>
    &nbsp;·&nbsp; <a href="om.html" style="color:inherit">Vores kilder</a>
  </div>
</footer>

<script src="js/nav.js"></script>
<!-- Generated per-entity extras (gitignored). Build with the build_*_extra.py scripts.
     persons-extra.js powers the page itself; works-extra.js + places-extra.js
     are loaded so EntityRefs can render the "Værker" and "Steder" sections. -->
<script src="data/persons-extra.js" onerror="void 0"></script>
<script src="data/works-extra.js" onerror="void 0"></script>
<script src="data/places-extra.js" onerror="void 0"></script>
<script src="js/entity-refs.js"></script>
<!-- Co-occurrence index for "Hyppigste …" sections (gitignored).
     Build with: python scripts/build_mockup/build_cooccurrence.py -->
<script src="data/cooccurrence.js" onerror="void 0"></script>
<!-- Generated diary data (gitignored). Build with:
     python scripts/build_mockup/build_diary_index.py -->
<script src="data/diary-index.js" onerror="void 0"></script>
<script src="data/diary-refs.js" onerror="void 0"></script>
<script src="js/table-view.js"></script>
<script src="js/diary-wire.js"></script>
<script>
/* Hand-curated PERSONS — takes precedence over generated PERSONS_EXTRA.
   Rich entries can override or extend any field; minimal entries just
   add a bio paragraph or Wikidata Q-number. Mirrors the WORKS / WORKS_EXTRA
   pattern in work.html. */
const PERSONS = {
  'Reg0052440': {
    label: 'Dickens, Charles (1812–1870)',
    born: '1812', died: '1870', era: '1800-tallet',
    description: 'Engelsk Digter (Boz).',
    nationality: 'Engelsk',
    role: 'Forfatter',
    wd: 'Q5686',
    bio: "Charles John Huffam Dickens (1812–1870), engelsk romanforfatter, " +
         "er en af det 19. århundredes mest læste og oversatte forfattere. " +
         "Andersen og Dickens lærte hinanden at kende i London i 1847, " +
         "da Andersen overværede en middag i Dickens' hjem i Devonshire Terrace. " +
         "Andersen besøgte i sommeren 1857 Gad's Hill Place i Kent, hvor han " +
         "opholdt sig i over fem uger."
  }
};

const ALL_PERSONS = Object.assign(
  {}, (typeof PERSONS_EXTRA !== 'undefined' ? PERSONS_EXTRA : {}), PERSONS
);

function escAttr(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

(function () {
  const params = new URLSearchParams(location.search);
  const reg = params.get('reg') || 'Reg0052440';   // default to Dickens
  const p = ALL_PERSONS[reg];

  if (!p) {
    document.getElementById('js-title').textContent = 'Ukendt person — ' + reg;
    document.getElementById('js-breadcrumb').innerHTML =
      '<a href="index.html">Forside</a><span class="breadcrumb__sep">›</span>' +
      '<a href="persons.html">Personregister</a><span class="breadcrumb__sep">›</span>' +
      '<span class="breadcrumb__current">' + escAttr(reg) + '</span>';
    return;
  }

  document.title = p.label + ' — HCA Open Repository';

  // Breadcrumb
  document.getElementById('js-breadcrumb').innerHTML =
    '<a href="index.html">Forside</a>' +
    '<span class="breadcrumb__sep">›</span>' +
    '<a href="persons.html">Personregister</a>' +
    '<span class="breadcrumb__sep">›</span>' +
    '<span class="breadcrumb__current">' + escAttr(p.label) + '</span>';

  // Hero title + chips
  document.getElementById('js-title').textContent = p.label;
  let chips = '<span class="chip chip--person">PERSON-REGISTER</span>';
  if (p.era) chips += '<span class="chip">' + escAttr(p.era) + '</span>';
  chips += '<span class="chip" style="font-family:monospace">' + escAttr(reg) + '</span>';
  if (p.wd) chips += '<a href="https://www.wikidata.org/wiki/' + escAttr(p.wd) +
    '" class="wd-badge" target="_blank" rel="noopener" title="' + escAttr(p.label) +
    ' på Wikidata">wd:' + escAttr(p.wd) + '</a>';
  document.getElementById('js-chips').innerHTML = chips;

  // Hero meta
  const metaItems = [];
  const lifespan = (p.born && p.died) ? p.born + '–' + p.died
                  : p.born ? '* ' + p.born
                  : p.died ? '† ' + p.died : null;
  if (lifespan) metaItems.push(lifespan);
  if (p.nationality) metaItems.push(p.nationality);
  if (p.role) metaItems.push(p.role);
  const total = (typeof DIARY_REFS !== 'undefined' && DIARY_REFS[reg])
    ? DIARY_REFS[reg].n : (p.refs || 0);
  metaItems.push(total + ' poster i dagbøgerne');
  document.getElementById('js-meta').innerHTML =
    metaItems.map(m => '<span>' + escAttr(m) + '</span>').join('');

  // ── Sidebar ──────────────────────────────────────────────────────────────
  let sb = '';
  sb += '<div class="info-block"><div class="info-block__header">Registerdata</div><div class="info-block__body"><table class="info-table">';
  sb += '<tr><td>ID</td><td style="font-family:monospace">' + escAttr(reg) + '</td></tr>';
  sb += '<tr><td>Register</td><td>PERSON-REGISTER</td></tr>';
  sb += '<tr><td>Label</td><td>' + escAttr(p.label) + '</td></tr>';
  if (p.born) sb += '<tr><td>Født</td><td>' + escAttr(p.born) + '</td></tr>';
  if (p.died) sb += '<tr><td>Død</td><td>' + escAttr(p.died) + '</td></tr>';
  if (p.nationality) sb += '<tr><td>Nationalitet</td><td>' + escAttr(p.nationality) + '</td></tr>';
  if (p.role) sb += '<tr><td>Rolle</td><td>' + escAttr(p.role) + '</td></tr>';
  sb += '<tr><td>Dagbogsrefs.</td><td>' + total + '</td></tr>';
  sb += '</table></div></div>';

  if (p.wd) {
    sb += '<div class="info-block info-block--enriched"><div class="info-block__header">Autoritetslinks<span class="info-block__tag">tilføjet</span></div><div class="info-block__body" style="display:flex;flex-direction:column;gap:8px;font-size:0.82rem">';
    sb += '<a href="https://www.wikidata.org/wiki/' + escAttr(p.wd) +
      '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px">' +
      '<span class="wd-badge">wd:' + escAttr(p.wd) + '</span>' +
      '<span style="color:var(--color-text-muted)">Wikidata</span></a>';
    sb += '</div></div>';
  }

  // Brevveksling -- a verified link into andersen.sdu.dk's Brevbasen
  // (a separate letter-correspondence database, distinct from this
  // register's own diary indexes). Only rendered for persons hand-verified
  // in data/curated/breve_person_crosswalk.csv -- see
  // docs/data-model/correspondence-integration.md §2-4. Outbound link,
  // so it follows docs/external-links.md: new tab, quiet styling, ↗ +
  // an .sr-only announcement rather than a styled button.
  if (p.breve) {
    sb += '<div class="info-block info-block--enriched"><div class="info-block__header">Brevveksling<span class="info-block__tag">tilføjet</span></div><div class="info-block__body" style="font-size:0.82rem">';
    sb += '<a class="external-link" href="' + escAttr(p.breve.url) + '" target="_blank" rel="noopener noreferrer">';
    sb += (p.breve.letters ? 'Se ' + p.breve.letters + ' breve ' : 'Se brevveksling ') + 'hos H.C. Andersen Centret';
    sb += '<span class="external-link__icon" aria-hidden="true">↗</span><span class="sr-only"> (åbner i nyt faneblad)</span></a>';
    sb += '</div></div>';
  }
  document.getElementById('js-sidebar').innerHTML = sb;

  // ── Main content ─────────────────────────────────────────────────────────
  let main = '';

  if (p.description) {
    main += '<div><h2 class="section-title">Beskrivelse</h2>' +
      '<p style="font-size:0.92rem;line-height:1.75;max-width:640px">' +
      escAttr(p.description) + '</p></div>';
  }
  if (p.bio) {
    main += '<div><h2 class="section-title">Biografi</h2>' +
      '<p style="font-size:0.92rem;line-height:1.75;max-width:640px">' +
      escAttr(p.bio) + '</p></div>';
  }

  // ── Værker af denne person ───────────────────────────────────────────────
  // Walks WORKS_EXTRA via EntityRefs.worksByAuthor, groups by H3 (form),
  // sorts groups by total refs desc. Section hides if empty.
  const myWorks = (typeof EntityRefs !== 'undefined') ? EntityRefs.worksByAuthor(reg) : [];
  if (myWorks.length) {
    const byH3 = {};
    for (const w of myWorks) {
      const k = w.h3 || '—';
      (byH3[k] = byH3[k] || []).push(w);
    }
    for (const k in byH3) byH3[k].sort((a, b) => (b.refs || 0) - (a.refs || 0));
    const groups = Object.keys(byH3).sort((a, b) => {
      const ra = byH3[a].reduce((s, w) => s + (w.refs || 0), 0);
      const rb = byH3[b].reduce((s, w) => s + (w.refs || 0), 0);
      return rb - ra;
    });
    let block = '<div><h2 class="section-title">Værker</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      myWorks.length + ' værk' + (myWorks.length === 1 ? '' : 'er') +
      ' tilskrevet ' + escAttr(p.label) + ' i registret.</p>';
    for (const h3 of groups) {
      const items = byH3[h3];
      block += '<div style="margin-bottom:var(--sp5)">' +
        '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;' +
        'letter-spacing:0.08em;color:var(--color-text-muted);margin-bottom:8px">' +
        escAttr(h3) + ' <span style="opacity:0.7">(' + items.length + ')</span></div>' +
        '<ul style="list-style:none;padding:0;margin:0;display:grid;' +
        'grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 16px;font-size:0.88rem">';
      const visible = items.slice(0, 12);
      for (const w of visible) {
        block += '<li><a href="' + escAttr(EntityRefs.workHrefByRid(w.rid)) +
          '" style="color:var(--color-text)">' + escAttr(w.title) + '</a>' +
          (w.refs ? ' <span style="color:var(--color-text-muted);font-size:0.78rem">· ' +
            w.refs + ' ref.</span>' : '') + '</li>';
      }
      if (items.length > visible.length) {
        block += '<li style="color:var(--color-text-muted);font-style:italic">' +
          '+ ' + (items.length - visible.length) + ' yderligere</li>';
      }
      block += '</ul></div>';
    }
    block += '</div>';
    main += block;
  }

  // ── Hyppigste steder ─────────────────────────────────────────────────────
  // Top places that co-occur with this person on the same diary page,
  // from cooccurrence.js (PERSON_TOP_PLACES). Section hides if empty.
  const topPlaces = (typeof PERSON_TOP_PLACES !== 'undefined' && PERSON_TOP_PLACES[reg]) || [];
  if (topPlaces.length) {
    let block = '<div><h2 class="section-title">Hyppigste steder</h2>' +
      '<p style="font-size:0.83rem;color:var(--color-text-muted);margin-bottom:var(--sp4)">' +
      'Steder der oftest nævnes på samme dagbogsside som ' + escAttr(p.label) + '.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    for (const [prid, n] of topPlaces) {
      const lab = (typeof PLACES_EXTRA !== 'undefined' && PLACES_EXTRA[prid] && PLACES_EXTRA[prid].label) || prid;
      block += '<a href="' + escAttr(EntityRefs.placeHrefByRid(prid)) +
        '" class="chip chip--place" style="font-size:0.82rem">' +
        escAttr(lab) + ' <span style="opacity:0.7;font-size:0.74rem">· ' + n + '</span></a>';
    }
    block += '</div></div>';
    main += block;
  }

  // Dagbogsreferencer — populated by DiaryWire below.
  main += '<div><h2 class="section-title">Dagbogsreferencer</h2>' +
    '<div class="results-header">' +
    '<p id="person-diary-summary" style="font-size:0.83rem;color:var(--color-text-muted);margin:0;flex:1">Indlæser…</p>' +
    '<div class="layout-switcher" id="person-diary-switcher">' +
    '<button class="layout-switcher__btn layout-switcher__btn--active" data-layout="list">☰ Liste</button>' +
    '<button class="layout-switcher__btn" data-layout="table">▦ Tabel</button>' +
    '</div></div>' +
    '<div class="result-grid" id="person-diary"></div>' +
    '<div style="text-align:center;margin-top:var(--sp5)">' +
    '<button id="person-diary-more" class="layout-switcher__btn" style="display:none;padding:7px 20px">Vis flere</button>' +
    '</div></div>';

  document.getElementById('js-main').innerHTML = main;

  // Wire up the diary section
  const grid = document.getElementById('person-diary');
  const summary = document.getElementById('person-diary-summary');
  const switcher = document.getElementById('person-diary-switcher');
  // A stale 'grid' value from before this switcher moved to Liste/Tabel
  // (or from a painting/sculpture page, which still writes 'grid' but under
  // its own 'diary-layout-visual' key) should not leave neither button
  // marked active on a page that no longer offers Gitter.
  function normalizeSavedLayout(v) {
    return (v === 'table' || v === 'list') ? v : 'list';
  }
  const savedLayout = (() => { try { return normalizeSavedLayout(localStorage.getItem('diary-layout')); } catch(e) { return 'list'; } })();
  const result = DiaryWire.refs(grid, reg, {
    pageSize: 24,
    layout: savedLayout,
    moreBtn: document.getElementById('person-diary-more'),
    onCount: function (shown, total) {
      if (summary) {
        summary.textContent = total === 0
          ? 'Ingen dagbogsreferencer registreret.'
          : 'Viser ' + shown + ' af ' + total + ' dagbogssider hvor ' +
            p.label + ' optræder.';
      }
    }
  });
  if (!result && summary) {
    summary.textContent = 'Dagbogsdata ikke indlæst (kør build_diary_index.py).';
  }
  if (result && switcher) {
    switcher.querySelectorAll('[data-layout]').forEach(b => {
      b.classList.toggle('layout-switcher__btn--active', b.dataset.layout === savedLayout);
    });
    switcher.addEventListener('click', ev => {
      const btn = ev.target.closest('[data-layout]');
      if (!btn) return;
      const nl = btn.dataset.layout;
      result.setLayout(nl);
      try { localStorage.setItem('diary-layout', nl); } catch(e) {}
      switcher.querySelectorAll('[data-layout]').forEach(b => {
        b.classList.toggle('layout-switcher__btn--active', b === btn);
      });
    });
  }
})();
</script>
</body>
</html>
