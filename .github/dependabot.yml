version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA
  # and the trailing "# vN" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # scripts/ci holds the hash-locked set the workflow installs
  # (requirements.in -> requirements.txt, compiled with pip-compile).
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # The human-edited range files. Dependabot only recognises files named
  # requirements.txt, so requirements-pdf/-ci/-dev.txt are covered by the
  # weekly pip-audit in security-audit.yml instead.
  - package-ecosystem: pip
    directory: /scripts/parsers
    schedule:
      interval: weekly
