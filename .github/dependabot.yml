version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA
  # and the trailing "# vN" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    # Dependabot only recognises files named requirements.txt, so the
    # differently named lists (requirements-pdf.txt, requirements-ci.txt)
    # are covered by the weekly security-audit workflow instead.
    directory: /scripts/parsers
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
