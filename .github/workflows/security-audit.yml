name: Security audit

on:
  pull_request:
    paths:
      - 'scripts/**/requirements*.txt'
      - 'scripts/requirements-ci.txt'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**/requirements*.txt'
      - 'scripts/requirements-ci.txt'
  schedule:
    - cron: '17 5 * * 1'   # weekly: new CVEs appear without any repo change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Resolves each requirements file the way pip would and checks the
      # result against the PyPI advisory database (fails on any finding).
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          for f in scripts/parsers/requirements.txt scripts/build_mockup/requirements-pdf.txt scripts/requirements-ci.txt; do
            echo "::group::$f"
            pip-audit -r "$f"
            echo "::endgroup::"
          done
