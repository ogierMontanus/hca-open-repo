name: Security audit

on:
  pull_request:
    paths:
      - 'scripts/**/requirements*.txt'
      - 'scripts/**/requirements.in'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**/requirements*.txt'
      - 'scripts/**/requirements.in'
  schedule:
    - cron: '17 5 * * 1'   # weekly: new CVEs appear without any repo change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Resolves each requirements file the way pip would and checks the
      # result against the PyPI advisory database (fails on any finding).
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          for f in scripts/ci/requirements.txt scripts/parsers/requirements.txt scripts/build_mockup/requirements-pdf.txt scripts/requirements-dev.txt; do
            echo "::group::$f"
            pip-audit -r "$f"
            echo "::endgroup::"
          done
