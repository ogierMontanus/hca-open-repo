name: Build HCA mockup

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data/normalized/**'
      - 'scripts/normalization/**'
      - 'scripts/build_web/**'
      - 'scripts/build_mockup/**'
      - 'web/**'
      - 'mockup/**'
      - '.github/workflows/build-mockup.yml'
  workflow_dispatch:

# Least privilege: the build job (which installs third-party packages and runs
# repo scripts) can only read. Only the separate deploy job gets the Pages /
# OIDC write scopes, and it runs no repo code.
permissions:
  contents: read

# Allow one in-flight Pages deployment at a time; queue new ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Hash-locked (scripts/ci/requirements.txt, compiled from requirements.in):
      # --require-hashes refuses any package whose file hash is not in the lock.
      # Covers scripts/parsers/requirements.txt plus the test tooling.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r scripts/ci/requirements.txt

      - name: Stage 1a — xlsx to normalised CSVs
        run: python scripts/normalization/hca_xlsx_to_csv.py

      - name: Stage 1b — parse Rejser HTM add-on
        run: python scripts/build_web/parse_rejser_htm.py
        continue-on-error: true

      - name: Stage 1c — reconcile SV14 place geocodes
        run: python scripts/build_mockup/reconcile_sv14_geo.py
        continue-on-error: true

      # Stage 1d — probable language per work title, for nation.html's
      # "På dette sprog" list. Needs `lingua` from
      # scripts/parsers/requirements.txt; without it the script still emits
      # the register-stated languages, so this step is non-fatal either way.
      - name: Stage 1d — detect work languages
        run: python scripts/build_mockup/detect_work_language.py
        continue-on-error: true

      # Stage 1e — ethnic/national adjectives per person, feeding both
      # persons-extra.js's Nationalitet facet (4b) and the nation index (4f).
      # Reads the V0.82 workbook directly, so it does not depend on Stage 1a.
      # Its output CSV is committed, so a failure here leaves the previous
      # extraction in place rather than emptying the facet.
      - name: Stage 1e — person ethnic descriptors
        run: python scripts/parsers/parse_person_ethnic_descriptors.py
        continue-on-error: true

      - name: Stage 2 — CSVs to web JSON
        run: python scripts/build_web/build_web_data.py

      # Stage 3 — diary layer for the mockup. Both builders read the
      # normalised CSVs from Stage 1a (references.csv, diary.csv,
      # entities.csv). Their outputs are gitignored, so CI must regenerate
      # them to ship the diary pages and index in the deployed site.
      - name: Stage 3a — generate diary pages
        run: python scripts/build_mockup/build_diary_pages.py

      - name: Stage 3b — generate diary index + reverse-index JS
        run: python scripts/build_mockup/build_diary_index.py

      # Stage 3c — per-page print data (text, footnotes, full name lists, KB
      # link) that the cart's "Download som PDF" loads on demand. Gitignored.
      - name: Stage 3c — generate diary print data (cart PDF)
        run: python scripts/build_mockup/build_diary_print.py

      # Stage 4 — per-entity card data. These three feed the ?reg=…
      # detail pages (work.html / persons.html / place.html) for all
      # 3,717 works · 10,228 persons · 2,508 places. Outputs are
      # gitignored; CI regenerates them every build.
      - name: Stage 4a — works-extra.js (all works)
        run: python scripts/build_mockup/build_works_extra.py

      - name: Stage 4b — persons-extra.js (all persons)
        run: python scripts/build_mockup/build_persons_extra.py

      - name: Stage 4c — places-extra.js (all places)
        run: python scripts/build_mockup/build_places_extra.py

      # Stage 4d — slim search index for the landing-page typeahead.
      # ~1.2 MB JS array over all 16,453 entities, sorted by ref count
      # so the empty-state "popular" suggestions need no extra work.
      - name: Stage 4d — search-index.js (landing typeahead)
        run: python scripts/build_mockup/build_search_index.py

      # Stage 4e — co-occurrence index for the reciprocal-link sections
      # ("Hyppigste steder/personer") on persons.html and place.html.
      # Joins references.csv on (vol, page) and emits top-12 peers per
      # entity, count >= 2.
      - name: Stage 4e — cooccurrence.js (reciprocal links)
        run: python scripts/build_mockup/build_cooccurrence.py

      # Stage 4f — nation.html mashup index, including the umbrella
      # clustering from data/curated/nation_umbrellas_da.csv (91 nationality
      # keys -> 36 pickable groups, sub-identities kept visible). Depends on
      # Stage 4c's places-extra.js, Stage 1d's work languages and Stage 1e's
      # person descriptors — all of which run above.
      - name: Stage 4f — nation-index.js (nation mashup)
        run: python scripts/build_mockup/build_nation_index.py
        continue-on-error: true

      - name: Lint — no stale person.html link targets
        run: python tests/test_no_stale_person_refs.py

      # Every generated artifact now exists, so the tests that skip locally
      # without a build run for real here (diary-print completeness,
      # REFS_CAP overflow, cart-PDF font coverage and markup vocabulary, …).
      - name: Tests
        run: python -m pytest tests -q

      - name: Bundle static site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          mkdir -p _site/mockup
          cp -r mockup/* _site/mockup/
          # Frozen, deliberately unlinked files (see CLAUDE.md) — not part of the site.
          rm -rf _site/mockup/irrelevant
          # Drop a small landing page at the root that points stakeholders
          # straight at the demo mockup. Overrides any web/index.html so
          # /hca-open-repo/ → mockup. The mockup also stays reachable at
          # /hca-open-repo/mockup/ for direct links.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="da">
          <head>
            <meta charset="utf-8">
            <title>H.C. Andersen Dagbogsregister — DEMO</title>
            <meta http-equiv="refresh" content="0; url=mockup/index.html">
            <link rel="canonical" href="mockup/index.html">
          </head>
          <body style="font-family:system-ui,sans-serif;padding:2rem;max-width:38rem;margin:auto">
            <p>Omdirigerer til <a href="mockup/index.html">demo-versionen af H.C. Andersen Dagbogsregister</a>…</p>
          </body>
          </html>
          HTML
          echo "Bundled $(find _site/mockup/diary-pages -name '*.html' | wc -l) diary pages"

      # Content-Security-Policy: GitHub Pages cannot send headers, so inject a
      # <meta> policy into every bundled page. Inline scripts are allowed by
      # hash, computed here from the pages as served (docs/security.md).
      - name: Apply Content-Security-Policy
        run: python scripts/build_mockup/apply_csp.py _site/mockup

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site


  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
